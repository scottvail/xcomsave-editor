# Builds the editor's release packages and publishes them as a GitHub Release
# when a v* tag is pushed. Run it by hand (Actions > release > Run workflow)
# with an existing tag to build or rebuild that tag's release.
#
#   Linux    xcomsave-editor_<ver>_linux_{amd64,arm64}.AppImage
#   Windows  xcomsave-editor_<ver>_windows_amd64.zip
#   macOS    xcomsave-editor_<ver>_macos_universal.dmg  (Intel + Apple Silicon)
#
# The macOS app and disk image are signed with Developer ID and notarized when
# these repository secrets are set (see .github/scripts/macos-codesign.sh):
# MACOS_CERT_P12, MACOS_CERT_PASSWORD, NOTARY_KEY_P8, NOTARY_KEY_ID,
# NOTARY_ISSUER_ID. Without them the release is built unsigned.
#
# xcom2json / json2xcom are released separately, from go-xcomsave.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  EDITOR: xcomsave-editor
  LDFLAGS: -s -w

jobs:
  linux:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04's glibc (2.35) is old enough for current distros.
          - runner: ubuntu-22.04
            arch: amd64
            appimage_arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
            appimage_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev desktop-file-utils
      - run: go test ./internal/...
      - name: Build
        run: go build -trimpath -ldflags "$LDFLAGS" -o "build/$EDITOR" "./cmd/$EDITOR"
      - name: Package AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          # The runner has no FUSE, so run appimagetool without mounting it.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          app=build/AppDir
          install -Dm755 "build/$EDITOR" "$app/usr/bin/$EDITOR"
          install -Dm644 "packaging/linux/$EDITOR.desktop" "$app/usr/share/applications/$EDITOR.desktop"
          install -Dm644 "packaging/linux/$EDITOR.png" "$app/usr/share/icons/hicolor/512x512/apps/$EDITOR.png"
          install -Dm644 LICENSE "$app/usr/share/doc/$EDITOR/LICENSE"
          cp "packaging/linux/$EDITOR.desktop" "packaging/linux/$EDITOR.png" "$app/"
          ln -s "usr/bin/$EDITOR" "$app/AppRun"
          desktop-file-validate "$app/$EDITOR.desktop"

          tool=build/appimagetool
          curl -fsSL -o "$tool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage"
          chmod +x "$tool"
          mkdir -p dist
          "$tool" --no-appstream "$app" "dist/${EDITOR}_${TAG#v}_linux_${{ matrix.arch }}.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: editor-linux-${{ matrix.arch }}
          path: dist/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Embed icon and version info
        working-directory: cmd/xcomsave-editor
        run: |
          ver=${TAG#v}
          go run github.com/tc-hib/go-winres@v0.3.3 simply \
            --arch amd64 --out rsrc --manifest gui --icon ../../assets/icon.png \
            --product-name "XCOM Save Editor" --file-description "XCOM Save Editor" \
            --original-filename "$EDITOR.exe" \
            --copyright "Copyright (C) 2026 Scott Vail" \
            --product-version "${ver%%-*}" --file-version "${ver%%-*}"
      - name: Build
        run: go build -trimpath -ldflags "$LDFLAGS -H=windowsgui" -o "build/$EDITOR.exe" "./cmd/$EDITOR"
      - name: Package
        run: |
          name=${EDITOR}_${TAG#v}_windows_amd64
          mkdir -p "build/$name" dist
          cp "build/$EDITOR.exe" LICENSE README.md "build/$name/"
          (cd build && 7z a -tzip -bso0 "../dist/$name.zip" "$name")
      - uses: actions/upload-artifact@v4
        with:
          name: editor-windows-amd64
          path: dist/*

  macos:
    runs-on: macos-latest
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      # Go 1.24 supports macOS 11+; build the cgo parts for the same.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      APP: XCOM Save Editor.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build universal binary
        run: |
          for arch in amd64 arm64; do
            cc_arch=$arch; [ $arch = amd64 ] && cc_arch=x86_64
            CGO_ENABLED=1 GOOS=darwin GOARCH=$arch CC="clang -arch $cc_arch" \
              go build -trimpath -ldflags "$LDFLAGS" -o "build/$EDITOR-$arch" "./cmd/$EDITOR"
          done
          lipo -create -output "build/$EDITOR" "build/$EDITOR-amd64" "build/$EDITOR-arm64"
          lipo -info "build/$EDITOR"
      - name: Make app bundle
        run: |
          ver=${TAG#v}
          app="build/$APP"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "build/$EDITOR" "$app/Contents/MacOS/"
          sed "s/@VERSION@/${ver%%-*}/g" packaging/macos/Info.plist >"$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          set=build/icon.iconset
          mkdir -p "$set"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$set/icon_${s}x${s}.png" >/dev/null
            sips -z $((s * 2)) $((s * 2)) assets/icon.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set" -o "$app/Contents/Resources/icon.icns"
      - name: Sign and notarize app
        run: |
          app="build/$APP"
          .github/scripts/macos-codesign.sh setup
          .github/scripts/macos-codesign.sh sign --options runtime "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          .github/scripts/macos-codesign.sh notarize "$app"
      - name: Make, sign and notarize disk image
        run: |
          dmg="dist/${EDITOR}_${TAG#v}_macos_universal.dmg"
          stage=build/dmg
          mkdir -p "$stage" dist
          ditto "build/$APP" "$stage/$APP"
          ln -s /Applications "$stage/Applications"
          # hdiutil sometimes fails with "Resource busy" on CI; retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "XCOM Save Editor" -srcfolder "$stage" -fs HFS+ \
              -format UDZO -ov "$dmg" && break
            [ $i = 5 ] && exit 1
            sleep 5
          done
          .github/scripts/macos-codesign.sh sign "$dmg"
          .github/scripts/macos-codesign.sh notarize "$dmg"
      - name: Check Gatekeeper
        if: env.MACOS_CERT_P12 != '' && env.NOTARY_KEY_P8 != ''
        run: |
          spctl --assess --type execute --verbose=2 "build/$APP"
          spctl --assess --type open --context context:primary-signature --verbose=2 dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: editor-macos-universal
          path: dist/*

  release:
    needs: [linux, windows, macos]
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * >SHA256SUMS.txt
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes *
          fi
